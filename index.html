<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastProxy by Tai</title><link rel="stylesheet" href="./styles.css"><style>.workspace{margin:24px 0;background:#090909;border:1px solid #333;border-radius:18px;padding:16px}.workspace iframe{width:100%;height:55vh;border:0;background:#fff;border-radius:12px}.workspace .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.workspace input{flex:1;min-width:200px}.account{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.account input{min-width:170px}.notice{color:#aaa;font-size:13px}button{cursor:pointer}</style></head><body><div class="wrap"><header><a class="brand" href="./">FastProxy by Tai</a><span class="sub">OLED · CONNECTED</span></header><main><section class="hero"><h1>Browse in one place.</h1><p>Account-based bookmarks and a built-in viewing panel.</p><div class="account"><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signup">Sign up</button><button id="signin">Sign in</button><button id="signout">Sign out</button></div><p id="auth-status" class="notice" role="status"></p></section><section class="workspace"><div class="toolbar"><input id="address" placeholder="Enter URL or search"><button id="go">Go</button><button id="bookmark">Save bookmark</button></div><iframe id="viewer" title="Embedded website" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-same-origin allow-popups-to-escape-sandbox"></iframe><p class="notice">Some websites prohibit embedding and will not display here. FastProxy does not bypass website restrictions or proxy traffic.</p></section><section><h2>Saved bookmarks</h2><div id="bookmarks" class="shortcuts"></div><p id="save-status" class="notice"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./app.js"></script></body></html>
